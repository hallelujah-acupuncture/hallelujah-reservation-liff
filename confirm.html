<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>予約確認・送信</title>
<meta name="description" content="晴レルヤ鍼灸院 予約確認・送信画面(管理者用)">
<meta property="og:title" content="晴レルヤ鍼灸院 予約確認・送信">
<meta property="og:description" content="管理者用の予約確認・送信画面です。">
<meta property="og:type" content="website">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --line-green: #06C755;
    --text-main: #1a1a1a;
    --text-sub: #767676;
    --border: #e5e5e5;
    --bg: #f7f7f7;
  }
  * { box-sizing: border-box; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text-main);
  }
  header {
    background: var(--line-green);
    color: #fff;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
  }
  main { padding: 16px; max-width: 480px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .info-box {
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .info-box .name { font-weight: 600; }
  .info-box .symptom { color: var(--text-sub); margin-top: 4px; white-space: pre-wrap; }
  label { font-size: 13px; color: var(--text-sub); display: block; margin-bottom: 6px; }
  textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary { background: var(--line-green); color: #fff; }
  .btn-secondary { background: #fff; color: var(--text-sub); border: 1px solid var(--border); }
  .btn:disabled { opacity: 0.5; }
  .status-msg { text-align: center; padding: 40px 16px; font-size: 14px; color: var(--text-sub); }
</style>
</head>
<body>

<header>予約確認・送信</header>
<main id="app">
  <div class="status-msg" id="loading">読み込んでいます…</div>
</main>

<script>
// ==== 設定 ====
const LIFF_ID = '2010906491-4U8zR5YA';
const API_URL = 'https://script.google.com/macros/s/AKfycbymXtgcnyMPrj1VFAvcNbmgg_9zU0sg_WL8sAma2WlCK5gRZ07-gt95f7nJUn0vNi_4/exec';
const HOUR_OPTIONS = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];

let reservationId = null;
let reservationData = null;

/**
 * LIFF SDKはid_tokenをlocalStorageにキャッシュし、有効期限が切れても
 * 自動更新しない仕様のため、期限切れの場合は保存データを削除する。
 * 戻り値: 期限切れを検知して削除した場合はtrue、それ以外はfalse
 */
function clearExpiredIdTokenIfNeeded() {
  const keyPrefix = 'LIFF_STORE:' + LIFF_ID + ':';
  const decoded = localStorage.getItem(keyPrefix + 'decodedIDToken');
  if (!decoded) return false;
  try {
    const payload = JSON.parse(decoded);
    if (Date.now() > payload.exp * 1000) {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key && key.indexOf(keyPrefix) === 0) {
          localStorage.removeItem(key);
        }
      }
      return true;
    }
  } catch (e) { /* パース失敗時は何もしない */ }
  return false;
}

/**
 * トークンが実際に期限切れのときだけ liff.init() をやり直す。
 * 期限内であれば何もしない(LINEとの通信を減らして体感速度を上げるため)。
 */
async function ensureFreshIdToken() {
  if (clearExpiredIdTokenIfNeeded()) {
    await liff.init({ liffId: LIFF_ID });
  }
}

async function init() {
  clearExpiredIdTokenIfNeeded();
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const params = new URLSearchParams(location.search);
  reservationId = params.get('reservationId');

  // 稀に liff.state 経由でパラメータが渡されるケースへのフォールバック
  if (!reservationId && params.get('liff.state')) {
    const stateParams = new URLSearchParams(params.get('liff.state').replace(/^\?/, ''));
    reservationId = stateParams.get('reservationId');
  }

  if (!reservationId) {
    document.getElementById('app').innerHTML = '<div class="status-msg">予約IDが指定されていません。</div>';
    return;
  }

  const idToken = liff.getIDToken();
  const res = await fetch(API_URL + '?action=getReservation&reservationId=' + encodeURIComponent(reservationId) + '&idToken=' + encodeURIComponent(idToken));
  const json = await res.json();

  if (!json.ok) {
    document.getElementById('app').innerHTML = '<div class="status-msg">予約情報を取得できませんでした(' + json.error + ')</div>';
    return;
  }

  reservationData = json.reservation;
  render(json.template);
}

function render(template) {
  const r = reservationData;
  const isInquiry = r.time === '(要相談)';
  const statusNote =
    r.status === '確定' ? '<p style="color:#06883f; font-size:13px; margin:0 0 12px;">※この予約はすでに確定済みです</p>' :
    r.status === '見送り' ? '<p style="color:#c00; font-size:13px; margin:0 0 12px;">※この予約はすでに見送り済みです</p>' :
    r.status !== '仮受付' ? '<p style="color:#c00; font-size:13px; margin:0 0 12px;">※現在のステータス「' + r.status + '」のため操作できません</p>' : '';

  const timeSelectHtml = isInquiry
    ? '<label>確定する時間を選択してください</label>' +
      '<select id="confirmedTime" onchange="onConfirmedTimeChange()">' +
        '<option value="">時間を選択</option>' +
        HOUR_OPTIONS.map(t => '<option value="' + t + '">' + t + '</option>').join('') +
      '</select>'
    : '';

  document.getElementById('app').innerHTML =
    '<div class="card">' +
      statusNote +
      '<div class="info-box">' +
        '<div class="name">' + r.displayName + ' 様' + (r.realName ? '(氏名:' + r.realName + ')' : '') + '</div>' +
        '<div>' + r.date + ' ' + (isInquiry ? '(問い合わせ)' : r.time + '〜') + '</div>' +
        '<div class="symptom">' + r.symptom + '</div>' +
      '</div>' +
      timeSelectHtml +
      '<label>送信メッセージ(編集可)</label>' +
      '<textarea id="message" rows="10">' + template + '</textarea>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="sendBtn" onclick="send()"' + (r.status !== '仮受付' ? ' disabled' : '') + '>送信</button>' +
        '<button class="btn btn-secondary" id="cancelBtn" onclick="cancelReservation()"' + (r.status !== '仮受付' ? ' disabled' : '') + '>見送る</button>' +
      '</div>' +
    '</div>';
}

function onConfirmedTimeChange() {
  const time = document.getElementById('confirmedTime').value;
  if (!time) return;
  const ta = document.getElementById('message');
  // 「日時:◯月◯日 ◯時〜」の◯時の部分だけを、選んだ時間に差し替える
  ta.value = ta.value.replace(/(日時:.+?)◯時〜|(日時:.+? )\d{2}:\d{2}〜/, function(match, p1, p2) {
    return (p1 || p2) + time + '〜';
  });
}

async function send() {
  const message = document.getElementById('message').value.trim();
  if (!message) {
    alert('メッセージを入力してください');
    return;
  }

  const isInquiry = reservationData.time === '(要相談)';
  const confirmedTimeEl = document.getElementById('confirmedTime');
  if (isInquiry && (!confirmedTimeEl || !confirmedTimeEl.value)) {
    alert('確定する時間を選択してください');
    return;
  }
  const confirmedTime = isInquiry ? confirmedTimeEl.value : undefined;

  setButtonsBusy('送信中…');

  await ensureFreshIdToken();

  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'confirm', reservationId: reservationId, message: message, confirmedTime: confirmedTime, idToken: liff.getIDToken() })
  });
  const json = await res.json();

  if (json.ok) {
    document.getElementById('app').innerHTML =
      '<div class="status-msg">送信しました。</div>' +
      '<button class="btn btn-primary" style="width:auto; display:block; margin:14px auto 0; padding:12px 24px;" onclick="goToManage()">枠設定(管理者用)に移動</button>';
  } else {
    alert('送信できませんでした(' + json.error + ')');
    location.reload();
  }
}

function goToManage() {
  location.href = 'https://liff.line.me/2010906491-OuYRJZKU';
}

async function cancelReservation() {
  const comment = prompt('見送る理由があれば入力してください(任意・お客様には送信されません)', '');
  if (comment === null) return; // キャンセルボタンが押された場合は中断

  setButtonsBusy('処理中…');

  await ensureFreshIdToken();

  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'cancel', reservationId: reservationId, comment: comment, idToken: liff.getIDToken() })
  });
  const json = await res.json();

  if (json.ok) {
    document.getElementById('app').innerHTML = '<div class="status-msg">見送りにしました。枠は再度予約可能になりました。</div>';
  } else {
    alert('処理できませんでした(' + json.error + ')');
    location.reload();
  }
}

function setButtonsBusy(label) {
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('cancelBtn').disabled = true;
  document.getElementById('sendBtn').textContent = label;
}

init();
</script>
</body>
</html>
