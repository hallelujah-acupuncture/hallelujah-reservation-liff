<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>枠設定</title>
<meta name="description" content="晴レルヤ鍼灸院 枠設定画面(管理者用)">
<meta property="og:title" content="晴レルヤ鍼灸院 枠設定">
<meta property="og:description" content="管理者用の予約枠設定画面です。">
<meta property="og:type" content="website">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --line-green: #06C755;
    --text-main: #1a1a1a;
    --text-sub: #767676;
    --border: #e5e5e5;
    --bg: #f7f7f7;
    --open: #4fa9d8;
    --open-bg: #e8f4fa;
    --amber: #8b5a3c;
    --amber-bg: #f2e9e4;
    --red: #c00;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
  }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  [onclick] { cursor: pointer; }

  header {
    background: var(--line-green);
    color: #fff;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 8px;
    flex-wrap: wrap;
  }
  .month-nav { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  .month-nav button { border: none; background: none; font-size: 18px; color: var(--text-sub); padding: 4px 8px; }
  .toolbar-actions { display: flex; gap: 8px; }
  .toolbar-actions button {
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--border);
    background: #fff; color: var(--text-main); white-space: nowrap;
  }
  .toolbar-actions button.primary { background: var(--line-green); color: #fff; border-color: var(--line-green); }

  #calendarArea { flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; }
  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
  .calendar-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; min-height: 0; }
  .day-cell {
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
    display: flex; flex-direction: column; padding: 3px 4px; overflow: hidden; min-height: 0;
  }
  .day-cell.empty { border: none; background: transparent; }
  .day-cell.consult { background: var(--amber-bg); }
  .day-cell.open { background: var(--open-bg); }
  .day-num { font-size: 11px; color: var(--text-sub); text-align: right; flex-shrink: 0; }
  .day-cell.consult .day-num { color: var(--amber); font-weight: 600; }
  .entry-list { flex: 1; overflow-y: auto; margin-top: 2px; display: flex; flex-direction: column; gap: 2px; }
  .entry-chip {
    background: #ffffffcc; border-left: 3px solid var(--open); border-radius: 3px;
    padding: 1px 4px; overflow: hidden; white-space: nowrap;
    font-size: 10px; line-height: 1.4;
  }
  .entry-chip.consult { border-left-color: var(--amber); }
  .entry-chip .entry-time { font-weight: 700; color: var(--open); }
  .entry-chip.consult .entry-time { color: var(--amber); }
  .entry-chip .entry-name { color: var(--text-main); }
  /* スマホ幅ではLINE表示名の短縮、PC幅ではLINE表示名フルを表示 */
  .entry-name-full { display: none; }
  .entry-name-short { display: inline; }
  @media (min-width: 700px) {
    .entry-name-full { display: inline; }
    .entry-name-short { display: none; }
  }
  .legend { display: flex; gap: 12px; padding: 6px 12px; font-size: 11px; color: var(--text-sub); flex-shrink: 0; background: #fff; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .dot.open { background: var(--open); }
  .dot.consult { background: var(--amber); }

  /* モーダル */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-end; justify-content: center; z-index: 1000;
  }
  .modal-content {
    background: #fff; border-radius: 16px 16px 0 0; padding: 16px; width: 100%; max-width: 480px;
    max-height: 85vh; overflow-y: auto;
  }
  @media (min-width: 600px) {
    .modal-overlay { align-items: center; }
    .modal-content { border-radius: 16px; }
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-title { font-size: 15px; font-weight: 700; }
  .modal-close { border: none; background: none; font-size: 20px; color: var(--text-sub); padding: 4px; }

  label { font-size: 12px; color: var(--text-sub); display: block; margin: 10px 0 4px; }
  input[type="text"], input[type="number"], input[type="time"], input[type="date"], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical;
  }
  .status-radio { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .status-radio label {
    flex: 1; text-align: center; padding: 8px 0; border: 1px solid var(--border);
    border-radius: 8px; font-size: 12px; color: var(--text-main); margin: 0; cursor: pointer; min-width: 28%;
  }
  .status-radio input { display: none; }
  .status-radio label.active { border-color: var(--line-green); background: #e6f9ee; font-weight: 700; }

  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }

  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 14px; }
  .btn-primary { background: var(--line-green); color: #fff; }
  .btn-secondary { background: #fff; color: var(--text-sub); border: 1px solid var(--border); }
  .status-msg { text-align: center; padding: 40px 16px; font-size: 14px; color: var(--text-sub); }
  .warn-note { font-size: 12px; color: var(--red); margin-top: 8px; }
</style>
</head>
<body>

<header>枠設定(管理者用)</header>
<div class="toolbar">
  <div class="month-nav">
    <button onclick="changeMonth(-1)">&lt;</button>
    <span id="monthLabel">-</span>
    <button onclick="changeMonth(1)">&gt;</button>
  </div>
  <div class="toolbar-actions">
    <button onclick="openBulkModal()">一括変更</button>
    <button class="primary" onclick="openManualModal()">手動登録</button>
  </div>
</div>
<div id="calendarArea">
  <div class="status-msg" id="loading">読み込んでいます…</div>
</div>
<div class="legend">
  <span><span class="dot open"></span>予約可</span>
  <span><span class="dot consult"></span>問い合わせ</span>
  <span>日付タップで個別設定</span>
</div>

<div id="modalRoot"></div>

<script>
// ==== 設定 ====
const LIFF_ID = '2010906491-OuYRJZKU';
const API_URL = 'https://script.google.com/macros/s/AKfycbymXtgcnyMPrj1VFAvcNbmgg_9zU0sg_WL8sAma2WlCK5gRZ07-gt95f7nJUn0vNi_4/exec';
const HOUR_OPTIONS = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];

let currentYear, currentMonth;
let daysData = {};

function clearExpiredIdTokenIfNeeded() {
  const keyPrefix = 'LIFF_STORE:' + LIFF_ID + ':';
  const decoded = localStorage.getItem(keyPrefix + 'decodedIDToken');
  if (!decoded) return false;
  try {
    const payload = JSON.parse(decoded);
    if (Date.now() > payload.exp * 1000) {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key && key.indexOf(keyPrefix) === 0) localStorage.removeItem(key);
      }
      return true;
    }
  } catch (e) {}
  return false;
}

// ページ読み込み時専用(必ずliff.init()する)
async function refreshLiff() {
  clearExpiredIdTokenIfNeeded();
  await liff.init({ liffId: LIFF_ID });
}

// ページ読み込み後の各操作の直前に使う。
// トークンが実際に期限切れのときだけliff.init()をやり直す(通信を減らして体感速度を上げる)。
async function ensureFreshIdToken() {
  if (clearExpiredIdTokenIfNeeded()) {
    await liff.init({ liffId: LIFF_ID });
  }
}

async function init() {
  await refreshLiff();
  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth() + 1;
  await loadMonth();
  renderCalendar();
}

function pad(n) { return String(n).padStart(2, '0'); }

async function loadMonth(year, month) {
  await ensureFreshIdToken();
  const y = year || currentYear;
  const m = month || currentMonth;
  const idToken = liff.getIDToken();
  const res = await fetch(API_URL + '?action=listSlotsAdmin&year=' + y + '&month=' + m + '&idToken=' + encodeURIComponent(idToken));
  const json = await res.json();
  if (!json.ok) {
    document.getElementById('calendarArea').innerHTML = '<div class="status-msg">読み込みに失敗しました(' + json.error + ')</div>';
    throw new Error(json.error);
  }
  if (!year || (year === currentYear && month === currentMonth)) {
    daysData = json.days;
  }
  return json.days;
}

async function changeMonth(diff) {
  currentMonth += diff;
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  document.getElementById('calendarArea').innerHTML = '<div class="status-msg">読み込んでいます…</div>';
  await loadMonth();
  renderCalendar();
}

function truncateName(name) {
  if (!name) return '';
  return name.length > 8 ? name.slice(0, 8) + '...' : name;
}

/** '10:00' → '10' のように、分が00の場合は時のみの表示にする */
function shortTime(time) {
  return time.endsWith(':00') ? time.slice(0, time.indexOf(':')) : time;
}

function dayCellClass(info) {
  if (!info) return '';
  if (info.status === '問い合わせ') return 'consult';
  if (info.slots && info.slots.length > 0) return 'open';
  return '';
}

function renderCalendar() {
  document.getElementById('monthLabel').textContent = currentYear + '年' + currentMonth + '月';

  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
  const firstWeekday = new Date(currentYear, currentMonth - 1, 1).getDay();
  const totalCells = firstWeekday + daysInMonth;
  const weeks = Math.ceil(totalCells / 7);

  document.getElementById('calendarArea').innerHTML =
    '<div class="weekday-row"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>' +
    '<div class="calendar-grid" id="calGrid" style="grid-template-rows: repeat(' + weeks + ', 1fr);"></div>';

  const grid = document.getElementById('calGrid');
  let html = '';

  for (let i = 0; i < firstWeekday; i++) {
    html += '<div class="day-cell empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = currentYear + '-' + pad(currentMonth) + '-' + pad(d);
    const info = daysData[dateStr];
    const cls = dayCellClass(info);

    let entriesHtml = '';
    if (info && info.reservations) {
      entriesHtml = info.reservations.map(r => {
        const isConsult = r.time === '(問い合わせ)';
        const timeLabel = isConsult ? '問合せ' : shortTime(r.time);
        return '<div class="entry-chip' + (isConsult ? ' consult' : '') + '">' +
          '<span class="entry-time">' + timeLabel + '</span> ' +
          '<span class="entry-name entry-name-full">' + r.nameFull + '</span>' +
          '<span class="entry-name entry-name-short">' + truncateName(r.nameShort) + '</span>' +
        '</div>';
      }).join('');
    }

    html +=
      '<div class="day-cell ' + cls + '" onclick="openDayModal(\'' + dateStr + '\')">' +
        '<div class="day-num">' + d + '</div>' +
        '<div class="entry-list">' + entriesHtml + '</div>' +
      '</div>';
  }

  grid.innerHTML = html;
}

/* ===== モーダル共通 ===== */
function showModal(title, bodyHtml) {
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" id="modalOverlay" onclick="if(event.target.id===\'modalOverlay\') closeModal();">' +
      '<div class="modal-content">' +
        '<div class="modal-header">' +
          '<div class="modal-title">' + title + '</div>' +
          '<button class="modal-close" onclick="closeModal()">×</button>' +
        '</div>' +
        bodyHtml +
      '</div>' +
    '</div>';
}

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

/* ===== 個別日設定モーダル ===== */
function openDayModal(dateStr) {
  const info = daysData[dateStr];
  const currentStatus = info ? (info.status === '問い合わせ' ? '問い合わせ' : (info.slots && info.slots.length > 0 ? '開放' : '非開放')) : '非開放';
  const openTimes = (info && info.slots) ? info.slots.map(s => s.time) : [];
  const bookedTimes = (info && info.slots) ? info.slots.filter(s => s.status === '埋まり').map(s => s.time) : [];
  const currentVenue = (info && info.venue) ? info.venue : '横浜市旭区若葉台';
  const booked = bookedTimes.length > 0;

  // 予約済み時間 → 表示名の対応表を作る
  const nameByTime = {};
  if (info && info.reservations) {
    info.reservations.forEach(r => { nameByTime[r.time] = r.nameFull; });
  }

  const hourCheckboxes = HOUR_OPTIONS.map(time => {
    const isOpen = openTimes.indexOf(time) !== -1;
    const isBooked = bookedTimes.indexOf(time) !== -1;

    if (isBooked) {
      const label = nameByTime[time] || '予約済';
      return '<label class="active" style="background:#e6f9ee; border-color:#06883f;" ' +
        'onclick="cancelBookedSlot(\'' + dateStr + '\', \'' + time + '\')">' +
        '<span>' + time + '(' + label + ')</span></label>';
    }

    return '<label class="' + (isOpen ? 'active' : '') + '">' +
      '<input type="checkbox" name="hourSlot" value="' + time + '"' +
        (isOpen ? ' checked' : '') +
        ' onchange="this.closest(\'label\').classList.toggle(\'active\', this.checked)">' +
      '<span>' + time + '</span></label>';
  }).join('');

  const body =
    '<div style="font-size:13px; color:var(--text-sub); margin-bottom:8px;">' + dateStr + '</div>' +
    (booked ? '<div class="warn-note">予約済み(赤色表示)の時間をタップすると見送り(キャンセル)できます。</div>' : '') +
    '<div class="status-radio" id="statusRadio">' +
      radioOption('非開放', currentStatus) +
      radioOption('開放', currentStatus) +
      radioOption('問い合わせ', currentStatus) +
    '</div>' +
    '<div id="openFields" style="display:' + (currentStatus === '開放' ? 'block' : 'none') + ';">' +
      '<label>予約可能にする時間(1時間ずつ個別に選択)</label>' +
      '<div class="status-radio">' + hourCheckboxes + '</div>' +
      '<label>会場</label><input type="text" id="venue" value="' + currentVenue + '">' +
    '</div>' +
    '<button class="btn btn-primary" id="saveDayBtn" onclick="saveDay(\'' + dateStr + '\')">保存</button>';

  showModal(dateStr + ' の設定', body);

  document.querySelectorAll('input[name="dayStatus"]').forEach(el => {
    el.addEventListener('change', () => {
      document.getElementById('openFields').style.display = el.value === '開放' ? 'block' : 'none';
    });
  });
}

const STATUS_LABEL = { '非開放': '予約不可', '開放': '予約可', '問い合わせ': '問い合わせ可能' };

function radioOption(value, current) {
  const checked = value === current ? 'checked' : '';
  return '<label class="' + (value === current ? 'active' : '') + '">' +
    '<input type="radio" name="dayStatus" value="' + value + '" ' + checked +
    ' onchange="document.querySelectorAll(\'.status-radio label\').forEach(l=>l.classList.remove(\'active\')); this.closest(\'label\').classList.add(\'active\');">' +
    '<span>' + STATUS_LABEL[value] + '</span></label>';
}

function cancelBookedSlot(dateStr, time) {
  const info = daysData[dateStr];
  const entry = info && info.reservations && info.reservations.find(r => r.time === time);
  if (!entry || !entry.reservationId) {
    alert('この予約の情報を取得できませんでした。');
    return;
  }

  const isConfirmed = entry.status === '確定';
  const actionLabel = isConfirmed ? 'キャンセル' : '見送り';

  const body =
    '<p style="font-size:14px; margin:0 0 12px;">' + dateStr + ' ' + time + '<br>' +
      '<strong>' + entry.nameFull + '</strong> 様の予約を' + actionLabel + 'にしますか?</p>' +
    '<label>' + actionLabel + '理由(任意・お客様には送信されません)</label>' +
    '<textarea id="cancelComment" rows="4"></textarea>' +
    '<div class="row2" style="margin-top:14px;">' +
      '<button class="btn btn-secondary" style="margin-top:0;" onclick="closeModal()">いいえ</button>' +
      '<button class="btn btn-primary" id="cancelConfirmBtn" style="margin-top:0;" ' +
        'onclick="submitCancelBooked(\'' + entry.reservationId + '\', \'' + actionLabel + '\')">はい、' + actionLabel + 'にする</button>' +
    '</div>';

  showModal(actionLabel + 'の確認', body);
}

async function submitCancelBooked(reservationId, actionLabel) {
  const comment = document.getElementById('cancelComment').value.trim();
  const btn = document.getElementById('cancelConfirmBtn');
  btn.disabled = true;
  btn.textContent = '処理中…';

  await ensureFreshIdToken();
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'cancel',
      reservationId: reservationId,
      comment: comment,
      idToken: liff.getIDToken()
    })
  });
  const json = await res.json();

  if (json.ok) {
    await loadMonth();
    renderCalendar();
    closeModal();
    alert(actionLabel + 'にしました。枠は再度予約可能になりました。');
  } else {
    alert('処理できませんでした(' + json.error + ')');
    btn.disabled = false;
    btn.textContent = 'はい、' + actionLabel + 'にする';
  }
}

async function saveDay(dateStr) {
  const status = document.querySelector('input[name="dayStatus"]:checked').value;
  const payload = { action: 'setDayStatus', date: dateStr, status: status };
  if (status === '開放') {
    payload.times = Array.from(document.querySelectorAll('input[name="hourSlot"]:checked')).map(el => el.value);
    payload.venue = document.getElementById('venue').value;
    if (payload.times.length === 0) {
      alert('開放する時間を1つ以上選んでください');
      return;
    }
  }

  const btn = document.getElementById('saveDayBtn');
  btn.disabled = true;
  btn.textContent = '保存中…';

  await ensureFreshIdToken();
  payload.idToken = liff.getIDToken();

  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
  const json = await res.json();

  if (json.ok) {
    await loadMonth();
    renderCalendar();
    closeModal();
  } else if (json.error === 'booked_slots_exist') {
    alert('予約済みの枠(' + json.bookedTimes.join(', ') + ')が含まれているため、この変更はできません。');
    btn.disabled = false; btn.textContent = '保存';
  } else {
    alert('保存できませんでした(' + json.error + ')');
    btn.disabled = false; btn.textContent = '保存';
  }
}

/* ===== 一括変更モーダル ===== */
function openBulkModal() {
  const body =
    '<div style="font-size:13px; color:var(--text-sub); margin-bottom:8px;">' + currentYear + '年' + currentMonth + '月の月・木に一括反映</div>' +
    '<div style="font-size:12px; color:var(--text-sub); margin-bottom:8px;">すでに個別設定済みの日はスキップされます(上書きしません)</div>' +
    '<div class="row2">' +
      '<div><label>開始時刻</label><input type="time" id="bulkStartTime" value="10:00"></div>' +
      '<div><label>枠数</label><input type="number" id="bulkSlotCount" value="5" min="1" max="20"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div><label>1枠の長さ(分)</label><input type="number" id="bulkSlotDuration" value="60" min="10" step="10"></div>' +
      '<div><label>会場</label><input type="text" id="bulkVenue" value="横浜市旭区若葉台"></div>' +
    '</div>' +
    '<button class="btn btn-primary" id="saveBulkBtn" onclick="saveBulk()">この内容で一括反映</button>';

  showModal('月・木に一括反映', body);
}

async function saveBulk() {
  const payload = {
    action: 'bulkApplyWeekday',
    year: currentYear,
    month: currentMonth,
    weekdays: [1, 4],
    startTime: document.getElementById('bulkStartTime').value,
    slotCount: Number(document.getElementById('bulkSlotCount').value),
    slotDurationMin: Number(document.getElementById('bulkSlotDuration').value),
    venue: document.getElementById('bulkVenue').value
  };

  const btn = document.getElementById('saveBulkBtn');
  btn.disabled = true;
  btn.textContent = '反映中…';

  await ensureFreshIdToken();
  payload.idToken = liff.getIDToken();

  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
  const json = await res.json();

  if (json.ok) {
    await loadMonth();
    renderCalendar();
    closeModal();
    alert('反映しました(' + json.appliedDates.length + '日)。既に設定済みでスキップした日:' + (json.skippedDates.length || 0) + '日');
  } else {
    alert('反映できませんでした(' + json.error + ')');
    btn.disabled = false; btn.textContent = 'この内容で一括反映';
  }
}

/* ===== 手動登録モーダル ===== */
function openManualModal() {
  const today = new Date();
  const defaultDate = currentYear + '-' + pad(currentMonth) + '-' + pad(today.getDate());

  const body =
    '<label>日付</label><input type="date" id="manualDate" value="' + defaultDate + '" onchange="onManualDateChange()">' +
    '<label>時間</label><select id="manualTime"><option value="">日付を選択してください</option></select>' +
    '<label>お名前</label><input type="text" id="manualName" placeholder="例:山田 太郎">' +
    '<label>連絡先(任意・電話番号など)</label><input type="text" id="manualContact" placeholder="例:090-xxxx-xxxx">' +
    '<label>症状・ご相談内容</label><textarea id="manualSymptom" rows="6"></textarea>' +
    '<button class="btn btn-primary" id="manualReserveBtn" onclick="submitManualReserve()">この内容で登録</button>';

  showModal('LINE以外(電話等)の予約を手動登録', body);
  onManualDateChange();
}

async function onManualDateChange() {
  const dateStr = document.getElementById('manualDate').value;
  if (!dateStr) return;
  const select = document.getElementById('manualTime');
  select.innerHTML = '<option value="">読み込み中…</option>';

  const [y, m] = dateStr.split('-').map(Number);
  const days = (y === currentYear && m === currentMonth) ? daysData : await loadMonth(y, m);
  const info = days[dateStr];
  const availableTimes = (info && info.slots) ? info.slots.filter(s => s.status === '空き').map(s => s.time) : [];

  select.innerHTML = availableTimes.length > 0
    ? availableTimes.map(t => '<option value="' + t + '">' + t + '</option>').join('')
    : '<option value="">この日に空き枠がありません</option>';
}

async function submitManualReserve() {
  const name = document.getElementById('manualName').value.trim();
  if (!name) {
    alert('お名前を入力してください');
    return;
  }
  const time = document.getElementById('manualTime').value;
  if (!time) {
    alert('時間を選択してください');
    return;
  }

  const payload = {
    action: 'manualReserve',
    date: document.getElementById('manualDate').value,
    time: time,
    name: name,
    contact: document.getElementById('manualContact').value.trim(),
    symptom: document.getElementById('manualSymptom').value.trim()
  };

  const btn = document.getElementById('manualReserveBtn');
  btn.disabled = true;
  btn.textContent = '登録中…';

  await ensureFreshIdToken();
  payload.idToken = liff.getIDToken();

  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
  const json = await res.json();

  if (json.ok) {
    await loadMonth();
    renderCalendar();
    closeModal();
    alert('登録しました');
  } else {
    alert('登録できませんでした(' + json.error + ')');
    btn.disabled = false; btn.textContent = 'この内容で登録';
  }
}

init();
</script>
</body>
</html>
